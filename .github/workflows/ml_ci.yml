name: ML CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ml/**'
      - 'scripts/**'
      - '.github/workflows/ml_ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ml/**'
      - 'scripts/**'
      - '.github/workflows/ml_ci.yml'

concurrency:
  group: ml-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml_verify:
    name: Machine Learning Validation & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Run ML Unit Tests
        run: python -m unittest ml/tests/test_forecaster.py


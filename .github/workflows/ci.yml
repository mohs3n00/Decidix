name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      # The render tools in test/tool skip themselves without their env vars.
      - run: flutter test

  android:
    name: Build Android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Debug build: it needs no signing key. The release build is made on the
      # machine that holds the key (see env/README.md).
      - run: flutter build apk --debug --dart-define-from-file=env/dev.json
      - uses: actions/upload-artifact@v4
        with:
          name: decidix-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

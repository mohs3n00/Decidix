name: Deploy Staging (Backend Subtree)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: run build, test, and subtree verification without deploying'
        type: boolean
        required: true
        default: true
      reason:
        description: 'Reason for staging deployment'
        required: false
        default: 'Manual deployment trigger'

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  verify_and_deploy:
    name: Verify & Deploy Backend to Heroku Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Compile Backend & Generate Prisma Client
        run: npm --prefix backend run build

      - name: Execute Backend Tests (Pre-Deployment Gate)
        run: npm --prefix backend test
        env:
          NODE_ENV: test
          ZERO_COST_ENFORCEMENT: 'true'
          OPENROUTER_API_KEY: 'test-ci-key'
          JWT_SECRET: 'test-ci-jwt-secret-minimum-32-chars-long'

      - name: Verify Backend Subtree Extraction
        run: |
          echo "Verifying backend subtree integrity..."
          SUBTREE_COMMIT=$(git subtree split --prefix backend)
          echo "Subtree commit generated: $SUBTREE_COMMIT"

      - name: Deploy Backend Subtree to Heroku Staging
        if: ${{ !inputs.dry_run }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME || 'decidix-backend-staging' }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL || 'mohsn9165@gmail.com' }}
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error::HEROKU_API_KEY secret is not configured in GitHub repository settings. Skipping deployment."
            exit 1
          fi

          echo "Configuring temporary Heroku remote for $HEROKU_APP_NAME..."
          git remote add heroku "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git"
          
          echo "Pushing backend subtree to Heroku main branch..."
          git subtree push --prefix backend heroku main
          echo "Deployment completed successfully."

      - name: Dry Run Completion Notice
        if: ${{ inputs.dry_run }}
        run: |
          echo "✅ Dry run completed successfully!"
          echo "Backend build, Vitest suite, and git subtree split verified."
          echo "No deployment was performed because dry_run=true."

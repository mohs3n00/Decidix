name: decidix_app
description: "Decidix: national development intelligence for decision makers. Mobile app (Flutter)."
publish_to: 'none' # Private app, not a package for pub.dev.

# version: build name + build number (Android versionCode, iOS CFBundleVersion).
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  flutter_svg: ^2.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/fonts/
    - assets/mock/overview/
    - assets/mock/insights/
    - assets/mock/intelligence/
    - assets/mock/decisions/

  # The fonts are inside the app: nothing is downloaded when it starts, so it
  # looks the same offline. Both are variable fonts (the weight is an axis).
  # Outfit has the Latin letters, Cairo the Arabic ones (and Latin as backup).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf

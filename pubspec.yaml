name: decidix_app
description: "Decidix: national development intelligence for decision makers. Mobile app (Flutter)."
publish_to: 'none' # Private app, not a package for pub.dev.

# version: build name + build number (Android versionCode, iOS CFBundleVersion).
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  flutter_svg: ^2.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# Launcher icon and splash screen, generated from the images that
# test/tool/render_icon_test.dart draws from the logo:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#061A3A"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#061A3A"
  image: assets/icon/splash_mark.png
  android_12:
    color: "#061A3A"
    image: assets/icon/splash_mark.png
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/fonts/
    - assets/mock/overview/
    - assets/mock/insights/
    - assets/mock/intelligence/
    - assets/mock/decisions/

  # The fonts are inside the app: nothing is downloaded when it starts, so it
  # looks the same offline. Both are variable fonts (the weight is an axis).
  # Outfit has the Latin letters, Cairo the Arabic ones (and Latin as backup).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
